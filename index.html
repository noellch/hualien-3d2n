<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F3EFE5">
  <title>HUALIEN 03 DAYS｜花蓮三天兩夜</title>
  <style>html,body{margin:0;background:#F3EFE5;color:#1D211E;font-family:system-ui,-apple-system,"PingFang TC",sans-serif}body{min-height:100vh}</style>
</head>
<body>
<script>
(async()=>{
  try{
    const version='20260818-widthfix1';
    const [baseRes,foodRes]=await Promise.all([
      fetch(`base.html?v=${version}`),
      fetch(`food.html?v=${version}`)
    ]);
    if(!baseRes.ok||!foodRes.ok) throw new Error('asset load failed');

    const [base,food]=await Promise.all([baseRes.text(),foodRes.text()]);
    const d=new DOMParser().parseFromString(base,'text/html');

    const viewport=d.querySelector('meta[name="viewport"]');
    if(viewport) viewport.setAttribute('content','width=device-width,initial-scale=1,viewport-fit=cover');

    const css=d.createElement('link');
    css.rel='stylesheet';
    css.href=`site.css?v=${version}`;
    d.head.appendChild(css);

    const widthFix=d.createElement('link');
    widthFix.rel='stylesheet';
    widthFix.href=`width-fix.css?v=${version}`;
    d.head.appendChild(widthFix);

    const nav=d.querySelector('.links');
    if(nav&&!nav.querySelector('a[href="#food"]')){
      const spotLink=nav.querySelector('a[href="#spots"]');
      const eat=d.createElement('a');
      eat.href='#food';
      eat.textContent='Eat Guide';
      if(spotLink) spotLink.insertAdjacentElement('afterend',eat); else nav.appendChild(eat);
    }

    const links=d.querySelector('#links');
    if(links) links.insertAdjacentHTML('beforebegin',food);

    const motion=d.createElement('script');
    motion.src=`motion.js?v=${version}`;
    motion.defer=true;
    d.body.appendChild(motion);

    document.open();
    document.write('<!doctype html>'+d.documentElement.outerHTML);
    document.close();
  }catch(err){
    document.body.innerHTML='<main style="max-width:680px;margin:18vh auto;padding:24px"><h1 style="font-size:32px">網站載入失敗</h1><p style="color:#65706a">請重新整理頁面。如果仍然無法載入，可以先開啟基礎版本。</p><p><a href="base.html" style="color:#B65F43;font-weight:700">開啟基礎版本 →</a></p></main>';
  }
})();
</script>
</body>
</html>
