<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUALIEN 03 DAYS｜花蓮三天兩夜</title></head><body><script>fetch('base.html').then(r=>r.text()).then(t=>{const d=new DOMParser().parseFromString(t,'text/html');const css=`<style>.food-intro{display:grid;grid-template-columns:.78fr 1.22fr;gap:70px;align-items:end;margin-bottom:44px}.food-list{border-top:2px solid var(--ink)}.food-item{display:grid;grid-template-columns:90px 210px 1fr 160px;gap:24px;padding:28px 0;border-bottom:1px solid var(--line);align-items:start;transition:padding-left .25s ease,background .25s ease}.food-item:hover{padding-left:10px;background:rgba(255,255,255,.18)}.food-no{font:900 2.8rem/.84 "DM Sans",sans-serif;letter-spacing:-.07em;color:var(--brick)}.food-name h3{margin:0 0 6px;font-size:1.1rem;line-height:1.4}.food-name small{display:block;color:var(--ink-42);font:700 .7rem/1.45 "DM Sans","Noto Sans TC",sans-serif;letter-spacing:.08em;text-transform:uppercase}.food-copy p{margin:0;color:var(--ink-60);font-size:.88rem;line-height:1.82}.food-order{margin-top:8px!important;color:var(--ink-80)!important;font-weight:700}.food-side{display:grid;gap:8px;justify-items:start}.food-tag{display:inline-block;padding:5px 7px;border:1px solid var(--line);color:var(--ink-60);font-size:.72rem;font-weight:800}.food-link{display:inline-flex;align-items:center;gap:5px;margin-top:4px;color:var(--brick);text-decoration:none;font:700 .7rem/1 "DM Sans",sans-serif;letter-spacing:.08em;transition:transform .22s ease}.food-link:hover{transform:translateX(3px)}.food-note{margin-top:28px;padding:17px 19px;border-left:4px solid #C9A24D;background:rgba(255,255,255,.26);color:var(--ink-60);font-size:.84rem;line-height:1.8}@media(max-width:960px){.food-intro{grid-template-columns:1fr;gap:28px}.food-item{grid-template-columns:72px 190px 1fr}.food-side{grid-column:3}}@media(max-width:680px){.food-item{grid-template-columns:54px 1fr;gap:14px}.food-name,.food-copy,.food-side{grid-column:2}.food-copy{margin-top:-6px}}</style>`;d.head.insertAdjacentHTML('beforeend',css);const nav=d.querySelector('.nav-links');if(nav)nav.insertAdjacentHTML('beforeend','<a href="#food">Eat Guide</a>');const food=`<section id="food" class="section" style="background:var(--paper-2)"><div class="wrap"><div class="food-intro"><div><div class="label" style="color:var(--brick)">Eat Guide 01—07</div><h2 class="headline">旅途中，<br>留幾餐給在地味道。</h2></div><p class="dek">不需要每一家都吃。Day 1 看抵達時間挑一個花蓮老味道；Day 2 在瑞穗吃一份小吃，晚上把胃留給福子；Day 3 下赤科山後再用玉里麵與臭豆腐收尾。營業時間容易變，真正要去的店出發前再確認一次。</p></div><div class="food-list"><article class="food-item"><div class="food-no">01</div><div class="food-name"><h3>廟口紅茶</h3><small>HUALIEN CITY / OLD SCHOOL</small></div><div class="food-copy"><p>花蓮舊城區很有代表性的老店，最有記憶點的是二樓飲料透過鋼管送到一樓。比起正餐，更適合當 Day 1 抵達後的輕食或甜湯補給。</p><p class="food-order">TRY / 鋼管紅茶、花生湯、杏仁湯、古早味小點。</p></div><div class="food-side"><span class="food-tag">DAY 01 · IF EARLY</span><span class="food-tag">LIGHT BITE</span><a class="food-link" href="https://www.google.com/maps/search/?api=1&query=%E5%BB%9F%E5%8F%A3%E7%B4%85%E8%8C%B6+%E8%8A%B1%E8%93%AE" target="_blank" rel="noopener">MAP ↗</a></div></article><article class="food-item"><div class="food-no">02</div><div class="food-name"><h3>公正包子</h3><small>HUALIEN CITY / QUICK BITE</small></div><div class="food-copy"><p>如果第一晚想吃得更像一餐，可以把它當快速解法：蒸餃、小籠包、湯麵都能迅速解決晚餐，而且不用把 Day 1 排得太正式。</p><p class="food-order">TRY / 小籠包＋蒸餃；想吃飽再加一碗湯或麵。</p></div><div class="food-side"><span class="food-tag">DAY 01</span><span class="food-tag">FAST & EASY</span><a class="food-link" href="https://www.google.com/maps/search/?api=1&query=%E5%85%AC%E6%AD%A3%E5%8C%85%E5%AD%90+%E8%8A%B1%E8%93%AE" target="_blank" rel="noopener">MAP ↗</a></div></article><article class="food-item"><div class="food-no">03</div><div class="food-name"><h3>瑞穗綠茶肉圓</h3><small>RUISUI / LOCAL CLASSIC</small></div><div class="food-copy"><p>離瑞穗車站很近，肉圓外皮加入舞鶴綠茶元素，是很有「這裡才吃得到」感的小吃。份量不需要吃太多，剛好可以留胃給下午與晚上的行程。</p><p class="food-order">TRY / 綠茶肉圓；想配湯可看當天的四神湯或小腸薑絲湯。</p></div><div class="food-side"><span class="food-tag">DAY 02 · LUNCH</span><span class="food-tag">NEAR STATION</span><a class="food-link" href="https://www.google.com/maps/search/?api=1&query=%E7%91%9E%E7%A9%97%E7%B6%A0%E8%8C%B6%E8%82%89%E5%9C%93" target="_blank" rel="noopener">MAP ↗</a></div></article><article class="food-item"><div class="food-no">04</div><div class="food-name"><h3>涂媽媽肉粽</h3><small>RUISUI / TAKE AWAY</small></div><div class="food-copy"><p>瑞穗另一個經典選項，特色是兩種糯米混合、搭配滷肉內餡。很適合當 Day 2 的第二份小吃，或直接外帶一顆路上吃，不需要特地排一個完整用餐時段。</p><p class="food-order">TRY / 招牌香粽＋四神湯。</p></div><div class="food-side"><span class="food-tag">DAY 02</span><span class="food-tag">SNACK / TAKEAWAY</span><a class="food-link" href="https://www.google.com/maps/search/?api=1&query=%E6%B6%82%E5%AA%BD%E5%AA%BD%E8%82%89%E7%B2%BD+%E7%91%9E%E7%A9%97" target="_blank" rel="noopener">MAP ↗</a></div></article><article class="food-item"><div class="food-no">05</div><div class="food-name"><h3>福子 fuzi</h3><small>HUALIEN CITY / RESERVED DINNER</small></div><div class="food-copy"><p>Day 2 的主角。白天瑞穗不要吃得太撐，就是為了 19:30 能好好坐下來吃這餐。這一間不需要再塞其他安排，晚餐本身就是當天的收尾。</p><p class="food-order">PLAN / 17:00 前後離開瑞穗，替還車、火車與市區移動留緩衝。</p></div><div class="food-side"><span class="food-tag" style="border-color:var(--brick);color:var(--brick)">19:30 RESERVED</span><span class="food-tag">DAY 02 MAIN</span><a class="food-link" href="https://www.google.com/maps/search/?api=1&query=%E7%A6%8F%E5%AD%90+fuzi+%E8%8A%B1%E8%93%AE" target="_blank" rel="noopener">MAP ↗</a></div></article><article class="food-item"><div class="food-no">06</div><div class="food-name"><h3>玉里麵</h3><small>YULI / MUST EAT</small></div><div class="food-copy"><p>赤科山下山後最合理的一餐。玉里麵的麵條直接煮熟拌油，口感細而有彈性，最經典就是油蔥、肉片與芹菜的簡單組合。鎮上老店很多，選順路的一家就可以。</p><p class="food-order">TRY / 乾玉里麵＋一盤黑白切；例如傳統美食玉里麵或橋頭麵。</p></div><div class="food-side"><span class="food-tag">DAY 03 · LUNCH</span><span class="food-tag">AFTER MOUNTAIN</span><a class="food-link" href="https://www.google.com/maps/search/?api=1&query=%E7%8E%89%E9%87%8C%E9%BA%B5+%E8%8A%B1%E8%93%AE%E7%8E%89%E9%87%8C" target="_blank" rel="noopener">MAP ↗</a></div></article><article class="food-item"><div class="food-no">07</div><div class="food-name"><h3>玉里橋頭臭豆腐</h3><small>YULI / CRISPY SNACK</small></div><div class="food-copy"><p>如果下山後還有胃，這家很適合和玉里麵組成「一正餐＋一小吃」。外層炸得酥、裡面保留豆腐口感，再配台式泡菜，是玉里很有代表性的排隊小吃。</p><p class="food-order">TRY / 原味臭豆腐；兩個人以上再考慮多點一份。</p></div><div class="food-side"><span class="food-tag">DAY 03</span><span class="food-tag">OPTIONAL SECOND STOP</span><a class="food-link" href="https://www.google.com/maps/search/?api=1&query=%E7%8E%89%E9%87%8C%E6%A9%8B%E9%A0%AD%E8%87%AD%E8%B1%86%E8%85%90" target="_blank" rel="noopener">MAP ↗</a></div></article></div><div class="food-note"><strong style="color:var(--ink)">FOOD NOTE /</strong> Day 3 晚上回花蓮市後不要再追遠距離名店。返台北車次優先，若時間壓縮，就在花蓮站周邊簡單吃；真正值得特地安排的美食，已經放在 Day 1–3 白天的動線裡。</div></div></section>`;const links=d.querySelector('#links');if(links)links.insertAdjacentHTML('beforebegin',food);document.open();document.write('<!doctype html>'+d.documentElement.outerHTML);document.close();}).catch(()=>{document.body.innerHTML='<p style="font-family:system-ui;padding:32px">網站載入失敗，請重新整理。</p>'});</script></body></html>
